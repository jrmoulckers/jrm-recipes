name: Pull request conflict report

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pull-request-conflict-report
  cancel-in-progress: false

jobs:
  report:
    name: Report conflicting pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@6044e13b5c580f29e2404c49add9ecf6462c7de8 # v6.3.0
        with:
          node-version: 24.15.0

      - name: Reconcile conflict labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/report-pr-conflicts.mjs
