# Vercel deploys from main, and this workflow is the quality gate before code
# lands. Generic lint, security, web, and performance behavior comes from the
# reviewed studio workflows pinned below. Recipes keeps its database, generated
# asset, E2E, and seeded Lighthouse behavior local.
name: CI

on:
  # Run the full gate on pushes to main and to the long-lived staging branch
  # (#266), on *every* pull request whatever its base, and when Release Please
  # explicitly dispatches CI for its GITHUB_TOKEN-created release PR.
  #
  # The `pull_request` trigger deliberately carries no `branches:` filter (#672).
  # It used to be `branches: [main]`, which meant a PR based on any other branch
  # ran none of this file. That did not present as "not run": Vercel and its
  # preview comment are not GitHub Actions, so they reported regardless and a
  # stacked PR showed a green check list and `MERGEABLE`. Measured on PR #670,
  # which was green while stacked and failed the first-load JS budget the moment
  # it was retargeted at main. Silence that reads as success is worse than the
  # runner minutes a stacked PR now costs, so do not narrow this again.
  push:
    branches: [main, staging]
  pull_request:
  # No user-supplied ref input: callers select a repository ref, and the
  # dispatch-guard job below accepts only the verified Release Please PR branch.
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a new push to a PR) to save CI time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN (#218): every job gets read-only
# access unless it opts into more. Third-party actions below are SHA-pinned.
permissions:
  contents: read

jobs:
  # A workflow_dispatch can be initiated from the Actions UI, so fail closed
  # unless the selected ref is the open, same-repository release PR created by
  # github-actions[bot]. Event-driven push/pull_request runs need no extra API
  # validation but still pass through this fast gate.
  dispatch-guard:
    name: Verify dispatch source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Accept event-driven CI
        if: github.event_name != 'workflow_dispatch'
        run: echo "CI was started by ${GITHUB_EVENT_NAME}."

      - name: Verify Release Please PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "::error::Release CI must target a repository branch."
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "release-please--branches--main" &&
                ! "$GITHUB_REF_NAME" =~ ^release-please--branches--main--components--[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Ref is not a Release Please branch for main."
            exit 1
          fi

          prs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f base=main \
            -f "head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}")"

          if ! jq -e \
            --arg branch "$GITHUB_REF_NAME" \
            --arg repo "$GITHUB_REPOSITORY" \
            'length == 1
              and .[0].state == "open"
              and .[0].base.ref == "main"
              and .[0].base.repo.full_name == $repo
              and .[0].head.ref == $branch
              and .[0].head.repo.full_name == $repo
              and .[0].user.login == "github-actions[bot]"
              and (.[0].title | startswith("chore(main): release"))' \
            <<<"$prs" >/dev/null; then
            echo "::error::Dispatch ref is not the verified open Release Please PR."
            exit 1
          fi

  # Variant 3 of #672: a `pull_request` run checks out `refs/pull/N/merge`, a
  # merge commit computed when the PR last changed. If main has moved since, the
  # run pairs one side's tests with the other side's source, and *both*
  # directions mislead. Red looks like a defect in your diff (measured on #690,
  # where the failure was already fixed on main by #693), and green certifies a
  # tree that no longer exists (measured on #776, which auto-merged cleanly and
  # was one spread operator away from red-lining main).
  #
  # Rerunning does not fix this: `gh run rerun` replays the original event
  # payload and checks out the same stale merge commit. Only a rebase does.
  #
  # So this job answers, in the run itself, the one question no other signal
  # answers: how far behind the base branch was the tree we just tested. It is
  # deliberately non-blocking — a PR going red simply because main moved would
  # train everyone to ignore it, and the remedy is a rebase the workflow must not
  # perform. It emits a warning annotation and a job summary instead.
  base-freshness:
    name: Base freshness
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Compare the tested base against the current base branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          behind="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${BASE_REF}" \
            --jq '.ahead_by')"

          {
            echo "### Base freshness"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Base branch | \`${BASE_REF}\` |"
            echo "| Base commit this run tested | \`${BASE_SHA:0:7}\` |"
            echo "| Commits added to \`${BASE_REF}\` since | ${behind} |"
          } >>"$GITHUB_STEP_SUMMARY"

          if [[ "$BASE_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "| Stacked on | \`${BASE_REF}\` (not \`${DEFAULT_BRANCH}\`) |" >>"$GITHUB_STEP_SUMMARY"
            echo "::notice::This PR is stacked on ${BASE_REF}. The full gate ran, but it validated your branch merged into ${BASE_REF}, not into ${DEFAULT_BRANCH}."
          fi

          if [[ "$behind" -gt 0 ]]; then
            {
              echo
              echo "These results describe your branch merged into \`${BASE_REF}\` as it stood ${behind} commit(s) ago."
              echo "Rebase before reading this run as authoritative:"
              echo
              echo '```bash'
              echo "git fetch origin && git rebase origin/${BASE_REF}"
              echo "git push --force-with-lease"
              echo '```'
              echo
              echo "Re-running this workflow will **not** refresh it: a rerun replays the original event and checks out the same merge commit."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::warning::${BASE_REF} has moved ${behind} commit(s) since this merge ref was built. Rebase (not rerun) before trusting these results."
          else
            echo "" >>"$GITHUB_STEP_SUMMARY"
            echo "This run tested the current tip of \`${BASE_REF}\`." >>"$GITHUB_STEP_SUMMARY"
          fi

  quality:
    name: Quality
    needs: dispatch-guard
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-lint.yml@f06bc9f51d347d2681d551f944fbbdf2e9514b53
    permissions:
      contents: read
      packages: read
      pull-requests: read
    with:
      node-version: '20'
      package-manager: pnpm
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
      lint-command: pnpm lint
      format-check-command: pnpm format:check
      semantic-pr-title: true

  security:
    name: Security
    needs: dispatch-guard
    uses: jrmoulckers/.github/.github/workflows/reusable-security-ci.yml@f06bc9f51d347d2681d551f944fbbdf2e9514b53
    permissions:
      contents: read
      packages: read
    with:
      node-version: '20'
      package-manager: pnpm
      audit-command: pnpm audit:ci
      run-package-audit: true
      run-secret-scan: true
      # Dependency graph is not enabled for this repository. Keep the canonical
      # package audit and verified-secret scan without an unavailable API gate.
      run-dependency-review: false
      dependency-fail-severity: high

  # Copy guards: catalog parity, ICU placeholders, untranslated and
  # English-leaking values, rich-text tag handlers, and alt-text justification.
  # These run as separate steps rather than one command so a failure names the
  # guard that caught it. All use only Node builtins, so this job skips the
  # dependency install entirely and stays fast.
  i18n:
    name: Copy and i18n guards
    needs: dispatch-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: Validate catalogs
        run: node scripts/i18n-validate.mjs
      # Catches values that were reworded but left in English. Catalog parity
      # and the identical-value check both pass those, which is how ~750 keys
      # once shipped English under translated keys.
      - name: Check for English leakage
        run: node scripts/i18n-english-leak.mjs
      # A tag with no handler makes next-intl throw at runtime, in that locale
      # only. Neither tsc nor eslint can see it.
      - name: Check rich-text tag handlers
        run: node scripts/i18n-rich-tags.mjs
      - name: Audit alt text
        run: node scripts/alt-audit.mjs
      # config/engineering/ is vendored from jrmoulckers/engineering at the ref
      # in engineering-configs.lock.json. --check re-hashes each file and fails
      # on drift, so a local edit to an upstream-owned file cannot ride in
      # unnoticed. It also reports a newer upstream release, but only warns:
      # failing on staleness would make the pin automatic in effect, pressuring
      # the next person into bumping the ref without deciding to accept it.
      # Runs here rather than in `web` because it needs no dependency install.
      - name: Verify vendored engineering configs
        run: node scripts/vendor-configs.mjs --check

  # Typecheck, unit tests, and the single production build share one canonical
  # install. The build command preserves Recipes' route budgets, then packages
  # hidden Next/Serwist output into a non-hidden artifact for downstream jobs.
  web:
    name: Web
    needs: dispatch-guard
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-web.yml@f06bc9f51d347d2681d551f944fbbdf2e9514b53
    permissions:
      contents: read
      packages: read
    with:
      node-version: '20'
      package-manager: pnpm
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
      typecheck-command: pnpm typecheck
      test-command: pnpm test
      build-command: pnpm ci:build
      build-env-json: '{"SKIP_ENV_VALIDATION":"1","NEXT_PUBLIC_APP_URL":"http://localhost:3000","NEXT_PUBLIC_DEV_AUTH_BYPASS":"1"}'
      artifact-name: next-build
      artifact-path: ci-artifact
      artifact-retention-days: 1

  # The canonical aggregate budget complements the stricter route-by-route
  # budget enforced during `ci:build`. Lighthouse public upload remains
  # explicitly disabled; the seeded product Lighthouse job below keeps reports
  # in private GitHub artifacts.
  performance:
    name: Performance
    needs: web
    uses: jrmoulckers/.github/.github/workflows/reusable-perf-budget.yml@f06bc9f51d347d2681d551f944fbbdf2e9514b53
    permissions:
      contents: read
      packages: read
    with:
      node-version: '20'
      package-manager: pnpm
      registry-url: https://npm.pkg.github.com
      registry-scope: '@jrmoulckers'
      artifact-name: ${{ needs.web.outputs.artifact-name }}
      output-dir: ci-artifact
      bundle-budget-kb: 32768
      lighthouse-public-upload: false

  # Fail if the committed Drizzle migrations don't match the schema (#242).
  # `drizzle-kit generate` is deterministic and needs no database, so we
  # regenerate from `src/server/db/schema` and assert the working tree stays
  # clean. A diff under `drizzle/` means someone changed the schema without
  # running `pnpm db:generate`, so the migration for their change is missing.
  migration-drift:
    name: Migration drift
    needs: dispatch-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.6.1
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@jrmoulckers'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate migrations from schema
        run: pnpm db:generate
      - name: Assert migrations are up to date
        run: |
          if ! git diff --exit-code -- drizzle; then
            echo "::error::Drizzle migrations are out of date. Run 'pnpm db:generate' locally and commit the generated files."
            exit 1
          fi

  # Validate that the full migration chain applies cleanly to a virgin database
  # (#245). Drift (#242) proves the migrations match the schema, and this proves they
  # actually run. Uses a throwaway Postgres service (hard-coded local credentials
  # NOT a repo secret, mirroring the e2e/lighthouse jobs) and runs the migrator
  # twice to confirm it is idempotent (the second run must be a clean no-op).
  # Finally it compares the resulting database back to the schema (#738), which
  # neither of the other two does.
  migrations:
    name: Migrations
    needs: dispatch-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heirloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/heirloom'
      SKIP_ENV_VALIDATION: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.6.1
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@jrmoulckers'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply migrations to a fresh database
        run: node scripts/migrate.mjs
      - name: Re-run migrations (must be a no-op)
        run: node scripts/migrate.mjs
      # Drift (#242) proves the migrations match the schema *as drizzle-kit
      # generates them*, and the step above proves they apply. Neither compares
      # the resulting database to the schema, so a hand-written migration that
      # alters a constraint passes both while the deployed action diverges
      # (#738). Referential actions decide what an existing delete does, so that
      # changes behaviour without changing any call site.
      - name: Assert deployed foreign keys match the schema
        run: pnpm db:check-fks
      # Referential actions are not the only thing that decides what a delete
      # does. A BEFORE DELETE trigger reaches the same state without being a
      # foreign key, so it passes the step above, both migration passes, drift
      # and the schema unit tests alike (measured on #761). Nothing else we run
      # looks at triggers.
      - name: Assert the database installs no unexpected triggers or rules
        run: pnpm db:check-triggers

  # End-to-end tests, including offline PWA coverage (issue #171). Playwright
  # starts the app in production mode (see playwright.config.ts) so the Serwist
  # service worker is ACTIVE during the run, since `next dev` disables it, so offline
  # behavior can only be verified against a production build. It reuses the
  # canonical `web` artifact and runs `pnpm start` (no second compile, #244). A
  # throwaway Postgres (a local service container with hard-coded credentials,
  # NOT a repo secret, mirroring the lighthouse job) is migrated + seeded so the
  # offline spec can open a real recipe and enter Cook Mode. The smoke spec is
  # database-agnostic.
  e2e:
    name: E2E
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heirloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/heirloom'
      SKIP_ENV_VALIDATION: '1'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      NEXT_PUBLIC_DEV_AUTH_BYPASS: '1'
      # Enables the dev identity selector so the co-creation specs can be two
      # different people (#698). Server-only - deliberately not NEXT_PUBLIC_ -
      # and set in this job alone, so the second identity is unreachable
      # everywhere else, including every Vercel deployment (#783).
      E2E_IDENTITY_SELECTOR: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.6.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@jrmoulckers'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Reuse the canonical web build instead of compiling again, since
      # playwright.config.ts runs `pnpm start` (not build) under CI. The archive
      # carries both `.next` and generated `public/sw.js`; extract it at the repo
      # root to restore each file to its original path.
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.web.outputs.artifact-name }}
          path: ci-artifact

      - name: Restore and verify build output
        run: |
          set -euo pipefail
          tar -xzf ci-artifact/next-build.tar.gz
          test -f .next/BUILD_ID
          test -f public/sw.js

      - name: Run migrations
        run: node scripts/migrate.mjs

      - name: Seed demo data
        run: pnpm db:seed

      # E2E-only fixture identity, kept out of the shared seed so it exists in
      # no dev, demo or preview database (#783).
      - name: Seed E2E fixtures
        run: pnpm db:seed:e2e

      # Cache the downloaded Playwright browser binaries (#243). Keyed on the
      # lockfile so a Playwright version bump re-downloads them.
      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      # A skipped test is invisible in the summary line: it does not fail and it
      # does not inflate a passing count. Name every skip and fail when they
      # grow (#843). `always()` so a red run still reports its skips.
      - name: Check E2E skips
        if: always()
        run: pnpm check:e2e-skips

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  # Runtime performance gate (issue #205). Unlike the other jobs, this one needs
  # real content on the recipe detail route, so it seeds an ephemeral, throwaway
  # Postgres whose credentials are hard-coded here (a local service container,
  # NOT a repo secret), keeping the "no secrets" property of the rest of CI. It
  # consumes the canonical production build, migrates + seeds, starts the app in
  # dev-bypass mode, and runs Lighthouse against the key routes with the Core
  # Web Vitals budgets in lighthouserc.cjs. Reports stay in private artifacts.
  lighthouse:
    name: Lighthouse
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heirloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/heirloom'
      SKIP_ENV_VALIDATION: '1'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      NEXT_PUBLIC_DEV_AUTH_BYPASS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.6.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@jrmoulckers'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.web.outputs.artifact-name }}
          path: ci-artifact

      - name: Restore and verify build output
        run: |
          set -euo pipefail
          tar -xzf ci-artifact/next-build.tar.gz
          test -f .next/BUILD_ID
          test -f public/sw.js

      - name: Run migrations
        run: node scripts/migrate.mjs

      - name: Seed demo data
        run: pnpm db:seed

      - name: Lighthouse CI
        run: pnpm exec lhci autorun --config=./lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

  # One check that summarises every gate above (#672). Two reasons it exists:
  #
  # 1. Branch protection can require a single, stable check name instead of a
  #    list that drifts every time a job is added or renamed. `main` is currently
  #    unprotected, so this is inert until a human enables it — see the "Needs
  #    Human Action" note on the PR that added this job.
  # 2. A skipped job reports neutral, which GitHub counts as success. This asserts
  #    on the actual result strings, so a job that never ran cannot pass as green.
  #
  # `base-freshness` is intentionally absent: it is advisory and only runs for
  # pull requests.
  gate:
    name: Quality gate
    if: always()
    needs:
      - dispatch-guard
      - quality
      - security
      - i18n
      - web
      - performance
      - migration-drift
      - migrations
      - e2e
      - lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Assert every gate succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'

          failed="$(echo "$RESULTS" | jq -r '
            to_entries
            | map(select(.value.result != "success"))
            | map("\(.key) (\(.value.result))")
            | join(", ")
          ')"

          if [[ -n "$failed" ]]; then
            echo "::error::Quality gate failed: ${failed}"
            exit 1
          fi

          echo "All gates succeeded."
