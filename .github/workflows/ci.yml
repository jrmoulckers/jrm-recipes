# Vercel deploys from main, and this workflow is the quality gate before code
# lands. Generic lint, security, web, and performance behavior comes from the
# reviewed studio workflows pinned below. Recipes keeps its database, generated
# asset, E2E, and seeded Lighthouse behavior local.
name: CI

on:
  # Run the full gate on pushes to main and to the long-lived staging branch
  # (#266), on every PR targeting main, and when Release Please explicitly
  # dispatches CI for its GITHUB_TOKEN-created release PR.
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  # No user-supplied ref input: callers select a repository ref, and the
  # dispatch-guard job below accepts only the verified Release Please PR branch.
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a new push to a PR) to save CI time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN (#218): every job gets read-only
# access unless it opts into more. Third-party actions below are SHA-pinned.
permissions:
  contents: read

jobs:
  # A workflow_dispatch can be initiated from the Actions UI, so fail closed
  # unless the selected ref is the open, same-repository release PR created by
  # github-actions[bot]. Event-driven push/pull_request runs need no extra API
  # validation but still pass through this fast gate.
  dispatch-guard:
    name: Verify dispatch source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Accept event-driven CI
        if: github.event_name != 'workflow_dispatch'
        run: echo "CI was started by ${GITHUB_EVENT_NAME}."

      - name: Verify Release Please PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "::error::Release CI must target a repository branch."
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "release-please--branches--main" &&
                ! "$GITHUB_REF_NAME" =~ ^release-please--branches--main--components--[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Ref is not a Release Please branch for main."
            exit 1
          fi

          prs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f base=main \
            -f "head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}")"

          if ! jq -e \
            --arg branch "$GITHUB_REF_NAME" \
            --arg repo "$GITHUB_REPOSITORY" \
            'length == 1
              and .[0].state == "open"
              and .[0].base.ref == "main"
              and .[0].base.repo.full_name == $repo
              and .[0].head.ref == $branch
              and .[0].head.repo.full_name == $repo
              and .[0].user.login == "github-actions[bot]"
              and (.[0].title | startswith("chore(main): release"))' \
            <<<"$prs" >/dev/null; then
            echo "::error::Dispatch ref is not the verified open Release Please PR."
            exit 1
          fi

  quality:
    name: Quality
    needs: dispatch-guard
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-lint.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace
    permissions:
      contents: read
      packages: read
      pull-requests: read
    with:
      node-version: "20"
      package-manager: pnpm
      registry-url: https://npm.pkg.github.com
      registry-scope: "@jrmoulckers"
      lint-command: pnpm lint
      format-check-command: pnpm format:check
      semantic-pr-title: true

  security:
    name: Security
    needs: dispatch-guard
    uses: jrmoulckers/.github/.github/workflows/reusable-security-ci.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace
    permissions:
      contents: read
      packages: read
    with:
      node-version: "20"
      package-manager: pnpm
      audit-command: pnpm audit:ci
      run-package-audit: true
      run-secret-scan: true
      # Dependency graph is not enabled for this repository. Keep the canonical
      # package audit and verified-secret scan without an unavailable API gate.
      run-dependency-review: false
      dependency-fail-severity: high

  # Copy guards: catalog parity, ICU placeholders, untranslated and
  # English-leaking values, rich-text tag handlers, and alt-text justification.
  # These run as separate steps rather than one command so a failure names the
  # guard that caught it. All use only Node builtins, so this job skips the
  # dependency install entirely and stays fast.
  i18n:
    name: Copy and i18n guards
    needs: dispatch-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: Validate catalogs
        run: node scripts/i18n-validate.mjs
      # Catches values that were reworded but left in English. Catalog parity
      # and the identical-value check both pass those, which is how ~750 keys
      # once shipped English under translated keys.
      - name: Check for English leakage
        run: node scripts/i18n-english-leak.mjs
      # A tag with no handler makes next-intl throw at runtime, in that locale
      # only. Neither tsc nor eslint can see it.
      - name: Check rich-text tag handlers
        run: node scripts/i18n-rich-tags.mjs
      - name: Audit alt text
        run: node scripts/alt-audit.mjs

  # Typecheck, unit tests, and the single production build share one canonical
  # install. The build command preserves Recipes' route budgets, then packages
  # hidden Next/Serwist output into a non-hidden artifact for downstream jobs.
  web:
    name: Web
    needs: dispatch-guard
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-web.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace
    permissions:
      contents: read
      packages: read
    with:
      node-version: "20"
      package-manager: pnpm
      registry-url: https://npm.pkg.github.com
      registry-scope: "@jrmoulckers"
      typecheck-command: pnpm typecheck
      test-command: pnpm test
      build-command: pnpm ci:build
      build-env-json: '{"SKIP_ENV_VALIDATION":"1","NEXT_PUBLIC_APP_URL":"http://localhost:3000","NEXT_PUBLIC_DEV_AUTH_BYPASS":"1"}'
      artifact-name: next-build
      artifact-path: ci-artifact
      artifact-retention-days: 1

  # The canonical aggregate budget complements the stricter route-by-route
  # budget enforced during `ci:build`. Lighthouse public upload remains
  # explicitly disabled; the seeded product Lighthouse job below keeps reports
  # in private GitHub artifacts.
  performance:
    name: Performance
    needs: web
    uses: jrmoulckers/.github/.github/workflows/reusable-perf-budget.yml@3b2d5cbb2cd619aca8e7cb1ac794086976033ace
    permissions:
      contents: read
      packages: read
    with:
      node-version: "20"
      package-manager: pnpm
      registry-url: https://npm.pkg.github.com
      registry-scope: "@jrmoulckers"
      artifact-name: ${{ needs.web.outputs.artifact-name }}
      output-dir: ci-artifact
      bundle-budget-kb: 32768
      lighthouse-public-upload: false

  # Fail if the committed Drizzle migrations don't match the schema (#242).
  # `drizzle-kit generate` is deterministic and needs no database, so we
  # regenerate from `src/server/db/schema` and assert the working tree stays
  # clean. A diff under `drizzle/` means someone changed the schema without
  # running `pnpm db:generate`, so the migration for their change is missing.
  migration-drift:
    name: Migration drift
    needs: dispatch-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.6.1
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@jrmoulckers"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate migrations from schema
        run: pnpm db:generate
      - name: Assert migrations are up to date
        run: |
          if ! git diff --exit-code -- drizzle; then
            echo "::error::Drizzle migrations are out of date. Run 'pnpm db:generate' locally and commit the generated files."
            exit 1
          fi

  # Validate that the full migration chain applies cleanly to a virgin database
  # (#245). Drift (#242) proves the migrations match the schema, and this proves they
  # actually run. Uses a throwaway Postgres service (hard-coded local credentials
  # NOT a repo secret, mirroring the e2e/lighthouse jobs) and runs the migrator
  # twice to confirm it is idempotent (the second run must be a clean no-op).
  # Finally it compares the resulting database back to the schema (#738), which
  # neither of the other two does.
  migrations:
    name: Migrations
    needs: dispatch-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heirloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/heirloom"
      SKIP_ENV_VALIDATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.6.1
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@jrmoulckers"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply migrations to a fresh database
        run: node scripts/migrate.mjs
      - name: Re-run migrations (must be a no-op)
        run: node scripts/migrate.mjs
      # Drift (#242) proves the migrations match the schema *as drizzle-kit
      # generates them*, and the step above proves they apply. Neither compares
      # the resulting database to the schema, so a hand-written migration that
      # alters a constraint passes both while the deployed action diverges
      # (#738). Referential actions decide what an existing delete does, so that
      # changes behaviour without changing any call site.
      - name: Assert deployed foreign keys match the schema
        run: pnpm db:check-fks

  # End-to-end tests, including offline PWA coverage (issue #171). Playwright
  # starts the app in production mode (see playwright.config.ts) so the Serwist
  # service worker is ACTIVE during the run, since `next dev` disables it, so offline
  # behavior can only be verified against a production build. It reuses the
  # canonical `web` artifact and runs `pnpm start` (no second compile, #244). A
  # throwaway Postgres (a local service container with hard-coded credentials,
  # NOT a repo secret, mirroring the lighthouse job) is migrated + seeded so the
  # offline spec can open a real recipe and enter Cook Mode. The smoke spec is
  # database-agnostic.
  e2e:
    name: E2E
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heirloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/heirloom"
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_DEV_AUTH_BYPASS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.6.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@jrmoulckers"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Reuse the canonical web build instead of compiling again, since
      # playwright.config.ts runs `pnpm start` (not build) under CI. The archive
      # carries both `.next` and generated `public/sw.js`; extract it at the repo
      # root to restore each file to its original path.
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.web.outputs.artifact-name }}
          path: ci-artifact

      - name: Restore and verify build output
        run: |
          set -euo pipefail
          tar -xzf ci-artifact/next-build.tar.gz
          test -f .next/BUILD_ID
          test -f public/sw.js

      - name: Run migrations
        run: node scripts/migrate.mjs

      - name: Seed demo data
        run: pnpm db:seed

      # Cache the downloaded Playwright browser binaries (#243). Keyed on the
      # lockfile so a Playwright version bump re-downloads them.
      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

  # Runtime performance gate (issue #205). Unlike the other jobs, this one needs
  # real content on the recipe detail route, so it seeds an ephemeral, throwaway
  # Postgres whose credentials are hard-coded here (a local service container,
  # NOT a repo secret), keeping the "no secrets" property of the rest of CI. It
  # consumes the canonical production build, migrates + seeds, starts the app in
  # dev-bypass mode, and runs Lighthouse against the key routes with the Core
  # Web Vitals budgets in lighthouserc.cjs. Reports stay in private artifacts.
  lighthouse:
    name: Lighthouse
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heirloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/heirloom"
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_DEV_AUTH_BYPASS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.6.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@jrmoulckers"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.web.outputs.artifact-name }}
          path: ci-artifact

      - name: Restore and verify build output
        run: |
          set -euo pipefail
          tar -xzf ci-artifact/next-build.tar.gz
          test -f .next/BUILD_ID
          test -f public/sw.js

      - name: Run migrations
        run: node scripts/migrate.mjs

      - name: Seed demo data
        run: pnpm db:seed

      - name: Lighthouse CI
        run: pnpm exec lhci autorun --config=./lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
