# Fails loudly when a production deployment fails, because nothing else does.
#
# Why this exists:
# Vercel deploys from `main`, but no GitHub Actions check reports on it. A PR
# stops being updated the moment it merges (see docs/ci.md, "After merge"), so
# `gh pr checks` shows the head ref's run and never the post-merge one. The only
# record of a failed production deploy is the deployments API, which nobody
# queries. Production sat 18 commits behind for hours before anyone noticed
# (#828), and the deploys had been failing the whole time.
#
# This does not check whether the deploy *should* have worked. It reports the
# outcome Vercel already published, in a place someone will see: a failed run on
# `main` notifies the repo owner, the same mechanism keep-warm.yml relies on.
#
# Deliberately not an auto-filed issue. Three production deploys failed today;
# an issue per failure would have produced three duplicates, and this repo
# already carries #826/#832 as a duplicate pair from exactly that reflex.
name: Deploy watch

on:
  # Fires for every deployment status Vercel publishes, including Preview builds
  # for pull requests -- hence the environment filter on the job below.
  deployment_status:
  # The event above cannot report a deploy that never started. See the drift job.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# The event payload carries the SHA, environment, and log URL, so this workflow
# needs no repo access at all.
permissions: {}

jobs:
  production-deploy-failed:
    name: Report failed production deployment
    # Preview deployments are noisy by design: one per push per PR, across a
    # fleet of concurrent sessions. Only Production is worth waking anyone for.
    # Vercel labels these deployments "Production".
    if: >-
      github.event.deployment.environment == 'Production' &&
      (github.event.deployment_status.state == 'failure' ||
       github.event.deployment_status.state == 'error')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail with the deployment details
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          DEPLOY_STATE: ${{ github.event.deployment_status.state }}
          DEPLOY_DESCRIPTION: ${{ github.event.deployment_status.description }}
          DEPLOY_LOG_URL: ${{ github.event.deployment_status.log_url }}
        run: |
          set -euo pipefail
          echo "Commit:      ${DEPLOY_SHA}"
          echo "State:       ${DEPLOY_STATE}"
          echo "Description: ${DEPLOY_DESCRIPTION}"
          echo "Logs:        ${DEPLOY_LOG_URL}"
          echo
          echo "Production is now serving an older commit than main."
          echo "This run is the notification, not the diagnosis -- read the logs above."
          echo "::error title=Production deployment failed::${DEPLOY_SHA} did not deploy (${DEPLOY_STATE}). Production is behind main."
          exit 1

  # The job above can only report deploys that produced a deployment_status
  # event. A quota-blocked deploy never creates a deployment object at all, so
  # no event is published and that job cannot run -- it is not filtered out,
  # there is nothing to filter (#868). Measured over twelve consecutive commits
  # on main, a Deploy watch run existed if and only if a deployment object did:
  # five of the twelve never reached production and produced no run, no event,
  # and a green Actions tab.
  #
  # Absence cannot be observed from an event that never fires, so this polls.
  # It also asserts the property actually wanted -- production is serving main --
  # instead of the absence of one known failure, so it needs no knowledge of
  # either mode and will not go blind when a third appears.
  #
  # It reads that property from /api/health rather than inferring it from the
  # deployments API (#871). Production publishes the commit it is serving; the
  # API only records what Vercel intended, and the two diverge exactly when a
  # deploy reports success without becoming the live alias.
  production-drift:
    name: Production drift
    # Skip on deployment_status runs: the job above already owns that path.
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          # rev-list needs the commits between the deployed sha and main.
          fetch-depth: 0

      - name: Compare main against the last successful production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEALTH_URL: https://heirloom.jrmoulckers.com/api/health
        run: |
          set -euo pipefail

          head_sha="$(git rev-parse HEAD)"

          # Ground truth: production self-reports the commit it is serving.
          # This is strictly better than the deployments API, which records what
          # Vercel *intended*. A deploy that reports success but never becomes
          # the live alias is invisible to the API and obvious here.
          health="$(curl -sS --max-time 30 "${HEALTH_URL}" || echo '')"
          if [ -z "${health}" ]; then
            echo "::error title=Production health unreachable::GET ${HEALTH_URL} returned nothing. Production may be down."
            exit 1
          fi

          deployed_sha="$(printf '%s' "${health}" | jq -r '.sha // ""')"
          health_status="$(printf '%s' "${health}" | jq -r '.status // "unknown"')"
          echo "health:   ${health}"

          if [ -z "${deployed_sha}" ] || [ "${deployed_sha}" = "dev" ]; then
            echo "::error title=Production reports no build sha::sha=${deployed_sha:-empty}. Cannot compute drift."
            exit 1
          fi

          drift="$(git rev-list --count "${deployed_sha}..${head_sha}" 2>/dev/null || echo unknown)"

          echo "main:     ${head_sha}"
          echo "deployed: ${deployed_sha}"
          echo "drift:    ${drift}"

          if [ "${drift}" = "0" ]; then
            echo "Production is serving main (status=${health_status})."
            exit 0
          fi

          # An in-flight deploy is not a failure; do not wake anyone mid-deploy.
          # Only the newest attempt matters -- an older one stuck in a non-terminal
          # state must not suppress the whole check.
          newest_id="$(gh api "repos/${REPO}/deployments?environment=Production&per_page=1" --jq '.[0].id // ""')"
          if [ -n "${newest_id}" ]; then
            newest_state="$(gh api "repos/${REPO}/deployments/${newest_id}/statuses?per_page=1" --jq '.[0].state // "none"')"
            case "${newest_state}" in
              pending | in_progress | queued)
                echo "A production deployment is in flight (${newest_state}). Nothing to report."
                exit 0
                ;;
            esac
          fi

          # Say which failure mode this is, per docs/ci.md "Which red is this?".
          # Read the message, not the colour: both render as a red Vercel check.
          description="$(gh api "repos/${REPO}/commits/${head_sha}/status" --jq '[.statuses[] | select(.context == "Vercel") | .description] | first // "no Vercel status"')"
          case "${description}" in
            *"rate limited"*) mode="account quota -- the deploy never started, so Deploy watch could not fire" ;;
            *"has failed"*) mode="the build ran and failed -- read its log" ;;
            *) mode="unrecognised; classify it before assuming" ;;
          esac

          echo
          echo "Vercel says: ${description}"
          echo "Mode:        ${mode}"
          echo "::error title=Production is behind main::Production is serving ${deployed_sha}, ${drift} commit(s) behind main. Mode: ${mode}"
          exit 1

  # A deployment_status of "success" says Vercel finished, not that users are
  # being served the new build. Those differ when a build succeeds but never
  # becomes the live alias, which no "successful" record can show you (#871).
  #
  # Deliberately unauthenticated and therefore shallow: this asserts the deploy
  # reached users and the database is reachable. It does NOT cover the deletion
  # panel or any signed-in privacy surface -- those need a session and belong in
  # E2E. Said plainly so this is not later mistaken for coverage it lacks, which
  # is how #868 happened.
  production-serving:
    name: Verify production is serving the deployed commit
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Poll health until it reports the deployed commit
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          HEALTH_URL: https://heirloom.jrmoulckers.com/api/health
        run: |
          set -euo pipefail

          served=""
          status=""
          db=""
          # Propagation is usually seconds; allow well past that before alarming.
          for attempt in $(seq 1 20); do
            health="$(curl -sS --max-time 30 "${HEALTH_URL}" || echo '')"
            if [ -n "${health}" ]; then
              served="$(printf '%s' "${health}" | jq -r '.sha // ""')"
              status="$(printf '%s' "${health}" | jq -r '.status // "unknown"')"
              db="$(printf '%s' "${health}" | jq -r '.db // "unknown"')"
              echo "Attempt ${attempt}: sha=${served} status=${status} db=${db}"
              if [ "${served}" = "${DEPLOY_SHA}" ]; then
                break
              fi
            else
              echo "Attempt ${attempt}: no response"
            fi
            sleep 15
          done

          if [ "${served}" != "${DEPLOY_SHA}" ]; then
            echo "::error title=Deploy reported success but is not being served::Vercel reported ${DEPLOY_SHA} deployed, but production is serving ${served:-nothing}."
            exit 1
          fi

          if [ "${status}" != "ok" ] || [ "${db}" != "ok" ]; then
            echo "::error title=Production is serving the new commit but is unhealthy::status=${status} db=${db}"
            exit 1
          fi

          echo "Production is serving ${DEPLOY_SHA} and reports healthy."
