# Deliberate connectivity diagnostic, not background warming. Each dispatch can
# wake Neon and consumes a function request; do not dispatch against paused hosting.
name: Manual connectivity check

on:
  workflow_dispatch:

# This workflow only makes an outbound HTTP request, so it needs no repo access.
permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check connectivity once via /api/health
        env:
          # Public, unauthenticated liveness probe that runs a live `select 1`.
          HEALTH_URL: https://heirloom.jrmoulckers.com/api/health
        run: |
          set -euo pipefail
          if ! code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$HEALTH_URL"); then
            echo "::error::Health request failed; no automatic retry."
            exit 1
          fi
          echo "HTTP ${code}"
          if [ "$code" = "200" ]; then
            exit 0
          fi
          echo "::error::Health check did not return 200."
          exit 1
