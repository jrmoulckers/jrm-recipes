# Keeps dependencies and GitHub Actions up to date with automatic PRs.
# Dependabot understands pnpm lockfiles under the "npm" ecosystem.
version: 2
updates:
  # Application dependencies (package.json / pnpm-lock.yaml).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    # Dependabot's default prefix is "build", which the Semantic PR title check
    # rejects: it is not one of the types AGENTS.md allows. Without this every
    # Dependabot PR is permanently red on a title check, and Quality gate fails
    # with it. A red check known to be meaningless trains reviewers to merge
    # past red, so this is a correctness fix, not cosmetics. See #837.
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
    # Batch low-risk bumps into a couple of PRs to cut noise; majors stay solo
    # so breaking changes get their own review.
    groups:
      production-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # The Actions used by the repository workflows.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'github-actions'
    # Same reason as the npm ecosystem above: keep titles on an allowed type.
    commit-message:
      prefix: 'chore'
