# Keeps dependencies and GitHub Actions up to date with automatic PRs.
# Dependabot understands pnpm lockfiles under the "npm" ecosystem.
version: 2

# `.npmrc` routes the @jrmoulckers scope to GitHub Packages but carries no
# credential, and GitHub Packages authenticates EVERY read -- including reads of
# a public package, since visibility decides authorization, not authentication.
# Dependabot runs on GitHub but is not an Actions job, so it never receives the
# per-job GITHUB_TOKEN that keeps CI green, and it reads only from its own
# secret store. Without this block every npm job 401s on
# @jrmoulckers/eslint-config and dies before it can resolve anything (#1021).
#
# The token must be a CLASSIC PAT with `read:packages`. Fine-grained tokens
# return an identical 401 against GitHub Packages, so the error text cannot
# tell you which mistake you made.
#
# COUPLED TO `.npmrc`: this block only routes the @jrmoulckers scope because
# `.npmrc` declares an explicit global `registry=`. Remove that line and
# Dependabot promotes the registry below to the base for EVERY package, which
# fails against GitHub Packages' stale npm mirror. Read the comment there
# before touching either file.
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}

updates:
  # Application dependencies (package.json / pnpm-lock.yaml).
  - package-ecosystem: 'npm'
    directory: '/'
    # Only the npm ecosystem needs this. `github-actions` below resolves against
    # GitHub's own API and never touches a package registry, which is why it has
    # kept working throughout (#766, #639) while every npm job failed.
    registries:
      - npm-github
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    # Dependabot's default prefix is "build", which the Semantic PR title check
    # rejects: it is not one of the types AGENTS.md allows. Without this every
    # Dependabot PR is permanently red on a title check, and Quality gate fails
    # with it. A red check known to be meaningless trains reviewers to merge
    # past red, so this is a correctness fix, not cosmetics. See #837.
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
    # Batch low-risk bumps into a couple of PRs to cut noise; majors stay solo
    # so breaking changes get their own review.
    groups:
      next-framework:
        patterns:
          - 'next'
          - '@next/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      production-minor-patch:
        dependency-type: 'production'
        exclude-patterns:
          - 'next'
        update-types:
          - 'minor'
          - 'patch'
      development-minor-patch:
        dependency-type: 'development'
        exclude-patterns:
          - '@next/*'
        update-types:
          - 'minor'
          - 'patch'

  # The Actions used by the repository workflows.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'github-actions'
    # Same reason as the npm ecosystem above: keep titles on an allowed type.
    commit-message:
      prefix: 'chore'
